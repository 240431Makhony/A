<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мой профиль</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-50:  #e6f7f7;
      --teal-100: #b3e8e8;
      --teal-200: #80d9d9;
      --teal-300: #4dcaca;
      --teal-400: #26bfbf;
      --teal-500: #00b3b3;
      --teal-600: #009999;
      --teal-700: #007a7a;
      --teal-800: #005c5c;
      --teal-900: #003d3d;
      --accent:   #00d4c8;
      --bg:       #e8f5f5;
      --card-bg:  #ffffff;
      --text:     #1a3a3a;
      --muted:    #5a8a8a;
      --shadow:   0 4px 24px rgba(0,179,179,0.13);
      --radius:   18px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px 80px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(0,179,179,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(0,212,200,0.09) 0%, transparent 55%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
      border: 1.5px solid rgba(0,179,179,0.10);
      animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--teal-800);
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    /* LOGIN CARD */
    .login-card {
      text-align: center;
      padding: 40px 28px;
    }
    .login-card .card-title { font-size: 1.5rem; margin-bottom: 10px; }
    .login-subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 28px; font-weight: 600; }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border: 2px solid #e0e0e0;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: #fff;
      color: #333;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
      width: 100%;
      justify-content: center;
    }
    .google-btn:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
    .google-btn:active { transform: scale(.97); }
    .google-icon { width: 22px; height: 22px; }

    .logout-btn {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: var(--teal-50);
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s;
    }
    .logout-btn:hover { background: var(--teal-100); }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 10px;
      border: 2.5px solid transparent;
      border-radius: 13px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .status-btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .status-btn:active { transform: scale(.97); }
    .status-btn.active {
      box-shadow: 0 0 0 3px var(--teal-300), 0 4px 16px rgba(0,179,179,0.25) !important;
      filter: brightness(1.08);
    }

    .btn-study  { background: #00b894; color: #fff; box-shadow: 0 3px 12px rgba(0,184,148,.25); }
    .btn-coffee { background: #fdcb6e; color: #5a3e00; box-shadow: 0 3px 12px rgba(253,203,110,.30); }
    .btn-game   { background: var(--teal-500); color: #fff; box-shadow: 0 3px 12px rgba(0,179,179,.28); }
    .btn-home   { background: #636e72; color: #fff; box-shadow: 0 3px 12px rgba(99,110,114,.22); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal-200), transparent);
      margin: 4px 0 16px;
    }

    #grouplist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 2px;
    }
    #grouplist::-webkit-scrollbar { width: 5px; }
    #grouplist::-webkit-scrollbar-track { background: var(--teal-50); border-radius: 10px; }
    #grouplist::-webkit-scrollbar-thumb { background: var(--teal-300); border-radius: 10px; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--teal-50);
      border: 1.5px solid rgba(0,179,179,0.08);
      transition: background .2s, transform .15s;
      animation: fadeIn .3s ease both;
    }
    .user-item:hover { background: var(--teal-100); transform: translateX(3px); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .user-info { flex: 1; min-width: 0; }
    .user-info strong {
      display: block;
      font-size: .95rem;
      font-weight: 800;
      color: var(--teal-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-info small { font-size: .8rem; color: var(--muted); font-weight: 600; }

    .dot-study  { background: #00b894; }
    .dot-coffee { background: #fdcb6e; }
    .dot-game   { background: #00b3b3; }
    .dot-home   { background: #636e72; }
    .dot-default{ background: #b2bec3; }

    .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 18px 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, var(--teal-400), var(--teal-600));
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: .5px;
      box-shadow: 0 2px 8px rgba(0,179,179,.22);
    }
    .badge::before { content:'●'; font-size:.6rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--teal-200);
      margin-right: 4px;
    }

    .profile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .profile-header-info { flex: 1; }
    .profile-header-info .name { font-weight: 800; font-size: 1rem; color: var(--teal-900); }
    .profile-header-info .email { font-size: .8rem; color: var(--muted); font-weight: 600; }

    /* ── ONLINE INDICATOR ── */
    .online-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--teal-50);
      border-radius: 10px;
      border: 1px solid rgba(0,179,179,0.12);
    }
    .online-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00d084;
      flex-shrink: 0;
      position: relative;
    }
    .online-pulse::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(0,208,132,0.3);
      animation: ripple 1.5s infinite;
    }
    @keyframes ripple {
      0%   { transform: scale(0.8); opacity: .8; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .online-text {
      font-size: .82rem;
      font-weight: 700;
      color: var(--teal-700);
    }
    .online-count {
      margin-left: auto;
      background: var(--teal-500);
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 20px;
    }

    /* online dot on user item */
    .user-item .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d084;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #00d084;
    }
    .user-item .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b2bec3;
      flex-shrink: 0;
    }
    .user-item-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ── STUDY TIMER ── */
    .timer-card { padding: 22px 28px; }
    .timer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .timer-display {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--teal-700);
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      padding: 14px;
      background: var(--teal-50);
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1.5px solid var(--teal-100);
    }
    .timer-display.running {
      color: #00b894;
      background: rgba(0,184,148,0.08);
      border-color: rgba(0,184,148,0.25);
    }
    .timer-controls {
      display: flex;
      gap: 10px;
    }
    .timer-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .timer-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .timer-btn:active { transform: scale(.97); }
    .timer-start { background: #00b894; color: #fff; }
    .timer-pause { background: #fdcb6e; color: #5a3e00; }
    .timer-reset { background: var(--teal-50); color: var(--muted); }
    .timer-stats {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .timer-stat {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: var(--teal-50);
      border-radius: 10px;
      border: 1px solid rgba(0,179,179,0.10);
    }
    .timer-stat-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--teal-700);
      display: block;
    }
    .timer-stat-lbl {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* ── CHAT ── */
    .chat-card { padding: 22px 28px 0; }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px 2px 12px;
      margin-bottom: 0;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: var(--teal-50); border-radius: 10px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--teal-300); border-radius: 10px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: msgIn .25s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-author {
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 2px;
      padding: 0 6px;
    }
    .msg-bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: .88rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.mine .msg-bubble {
      background: linear-gradient(135deg, var(--teal-500), var(--teal-600));
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.theirs .msg-bubble {
      background: var(--teal-50);
      color: var(--teal-900);
      border: 1px solid rgba(0,179,179,0.12);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: .68rem;
      color: var(--muted);
      margin-top: 2px;
      padding: 0 6px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 0 16px;
      border-top: 1px solid rgba(0,179,179,0.10);
      margin-top: 4px;
      position: sticky;
      bottom: 0;
      background: #fff;
    }
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--teal-100);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      color: var(--text);
      background: var(--teal-50);
      outline: none;
      transition: border-color .2s;
    }
    .chat-input:focus { border-color: var(--teal-400); background: #fff; }
    .chat-input::placeholder { color: var(--muted); }
    .chat-send {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal-400), var(--teal-600));
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      transition: transform .15s, filter .15s;
      white-space: nowrap;
    }
    .chat-send:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .chat-send:active { transform: scale(.97); }
    .chat-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .chat-empty { text-align:center; color:var(--muted); font-size:.85rem; padding:24px 0; }

    /* group card header row */
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Login Card -->
  <div class="card login-card" id="loginCard">
    <div style="font-size:3rem;margin-bottom:12px;">👋</div>
    <div class="card-title">Добро пожаловать!</div>
    <div class="login-subtitle">Войдите чтобы установить свой статус и видеть статусы группы</div>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Войти через Google
    </button>
  </div>

  <!-- Profile Card -->
  <div class="card" id="profileCard" style="display:none;">
    <div class="badge">ОНЛАЙН</div>
    <div class="card-title">Мой профиль</div>

    <div class="profile-header">
      <img id="userAvatar" class="avatar" src="" alt="avatar" onerror="this.style.display='none'"/>
      <div class="profile-header-info">
        <div class="name" id="userName">...</div>
        <div class="email" id="userEmail">...</div>
      </div>
    </div>

    <div class="btn-grid">
      <button class="status-btn btn-study"  onclick="changeStatus('Учусь','#00b894',this)">📚 Учусь</button>
      <button class="status-btn btn-coffee" onclick="changeStatus('Кофе-брейк','#fdcb6e',this)">☕ Кофе</button>
      <button class="status-btn btn-game"   onclick="changeStatus('В игре','#00b3b3',this)">🎮 В игре</button>
      <button class="status-btn btn-home"   onclick="changeStatus('Дома','#636e72',this)">🏠 Дома</button>
    </div>

    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
  </div>

  <!-- Study Timer Card -->
  <div class="card timer-card" id="timerCard" style="display:none;">
    <div class="timer-header">
      <div class="card-title" style="margin-bottom:0;">⏱ Таймер учёбы</div>
    </div>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-controls">
      <button class="timer-btn timer-start" id="timerStartBtn" onclick="timerStart()">▶ Старт</button>
      <button class="timer-btn timer-pause" id="timerPauseBtn" onclick="timerPause()" style="display:none;">⏸ Пауза</button>
      <button class="timer-btn timer-reset" onclick="timerReset()">↺ Сброс</button>
    </div>
    <div class="timer-stats">
      <div class="timer-stat">
        <span class="timer-stat-val" id="statSessions">0</span>
        <span class="timer-stat-lbl">Сессий</span>
      </div>
      <div class="timer-stat">
        <span class="timer-stat-val" id="statTotal">0 мин</span>
        <span class="timer-stat-lbl">Всего сегодня</span>
      </div>
      <div class="timer-stat">
        <span class="timer-stat-val" id="statStreak">🔥 0</span>
        <span class="timer-stat-lbl">Дней подряд</span>
      </div>
    </div>
  </div>

  <!-- Group Monitor Card -->
  <div class="card" id="groupCard" style="display:none;">
    <div class="group-header">
      <div class="card-title" style="margin-bottom:0;">Монитор группы</div>
      <div class="online-count" id="onlineCount">0 онлайн</div>
    </div>

    <!-- Online indicator bar -->
    <div class="online-bar" id="onlineBar">
      <div class="online-pulse"></div>
      <span class="online-text" id="onlineBarText">Нет активных пользователей</span>
    </div>

    <div class="divider"></div>
    <div id="grouplist"><div class="empty">Загрузка…</div></div>
  </div>

  <!-- Chat Card -->
  <div class="card chat-card" id="chatCard" style="display:none;">
    <div class="card-title" style="margin-bottom:14px;">💬 Чат группы</div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty">Загрузка сообщений…</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text" placeholder="Напишите сообщение…" maxlength="300"
        onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="chat-send" id="chatSendBtn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://styuzsotvczcicwbrgzi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lCwf-mXqiS3ci9bDqVem1Q_ufJd_cv9';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const STATUS_ICONS = { 'Учусь':'📚','Кофе-брейк':'☕','В игре':'🎮','Дома':'🏠' };
  const COLOR_CLASS  = { '#00b894':'dot-study','#fdcb6e':'dot-coffee','#00b3b3':'dot-game','#636e72':'dot-home' };

  let currentUser = null;
  let pollInterval = null;
  let chatSub = null;

  // ── ONLINE PRESENCE ──
  const ONLINE_THRESHOLD = 60 * 1000; // 60 sec

  async function pingOnline() {
    if (!currentUser) return;
    await supabase.from('profiles')
      .update({ last_seen: new Date().toISOString() })
      .eq('id', currentUser.id);
  }

  function isOnline(lastSeen) {
    if (!lastSeen) return false;
    return Date.now() - new Date(lastSeen).getTime() < ONLINE_THRESHOLD;
  }

  // ── TIMER ──
  let timerSeconds = 0;
  let timerRunning = false;
  let timerInterval = null;
  let timerSessions = parseInt(localStorage.getItem('t_sessions') || '0');
  let timerTotalMins = parseInt(localStorage.getItem('t_total_' + todayKey()) || '0');

  function todayKey() {
    return new Date().toISOString().slice(0,10);
  }

  function updateTimerDisplay() {
    const h = Math.floor(timerSeconds / 3600);
    const m = Math.floor((timerSeconds % 3600) / 60);
    const s = timerSeconds % 60;
    const disp = document.getElementById('timerDisplay');
    disp.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    disp.className = 'timer-display' + (timerRunning ? ' running' : '');
  }

  window.timerStart = function() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
      timerSeconds++;
      updateTimerDisplay();
    }, 1000);
    document.getElementById('timerStartBtn').style.display = 'none';
    document.getElementById('timerPauseBtn').style.display = 'block';
  };

  window.timerPause = function() {
    if (!timerRunning) return;
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById('timerStartBtn').style.display = 'block';
    document.getElementById('timerPauseBtn').style.display = 'none';
    updateTimerDisplay();
  };

  window.timerReset = function() {
    // Save stats before reset
    if (timerSeconds > 30) {
      timerSessions++;
      timerTotalMins += Math.floor(timerSeconds / 60);
      localStorage.setItem('t_sessions', timerSessions);
      localStorage.setItem('t_total_' + todayKey(), timerTotalMins);
      updateStreakStat();
    }
    timerRunning = false;
    clearInterval(timerInterval);
    timerSeconds = 0;
    document.getElementById('timerStartBtn').style.display = 'block';
    document.getElementById('timerPauseBtn').style.display = 'none';
    updateTimerDisplay();
    updateTimerStats();
  };

  function updateStreakStat() {
    // simple streak: count consecutive days with sessions
    let streak = 0;
    const today = new Date();
    for (let i = 0; i < 30; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = 't_total_' + d.toISOString().slice(0,10);
      if (parseInt(localStorage.getItem(key) || '0') > 0) streak++;
      else break;
    }
    return streak;
  }

  function updateTimerStats() {
    document.getElementById('statSessions').textContent = timerSessions;
    document.getElementById('statTotal').textContent = timerTotalMins + ' мин';
    document.getElementById('statStreak').textContent = '🔥 ' + updateStreakStat();
  }

  // ── AUTH ──
  window.loginWithGoogle = async () => {
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: 'https://240431makhony.github.io/A/',
        queryParams: { prompt: 'select_account' }
      }
    });
  };

  window.logout = async () => {
    clearInterval(pollInterval);
    if (chatSub) chatSub.unsubscribe();
    await supabase.auth.signOut();
    window.location.reload();
  };

  // ── PROFILE ──
  async function ensureProfile(user) {
    const { data } = await supabase.from('profiles').select('id').eq('id', user.id).single();
    if (!data) {
      const username = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'User';
      await supabase.from('profiles').insert({
        id: user.id, username, status: 'Дома', color: '#636e72',
        last_seen: new Date().toISOString()
      });
    } else {
      await supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', user.id);
    }
  }

  // ── STATUS ──
  window.changeStatus = async (text, color, btn) => {
    if (!currentUser) return;
    document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    await supabase.from('profiles').update({ status: text, color, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
    fetchGroup();
  };

  // ── GROUP LIST ──
  async function fetchGroup() {
    const { data } = await supabase.from('profiles').select('*').order('username', { ascending: true });
    const list = document.getElementById('grouplist');
    if (!data || data.length === 0) { list.innerHTML = '<div class="empty">Нет участников</div>'; return; }

    const onlineUsers = data.filter(u => isOnline(u.last_seen));
    const onlineCount = onlineUsers.length;

    // Update online bar
    document.getElementById('onlineCount').textContent = onlineCount + ' онлайн';
    if (onlineCount > 0) {
      const names = onlineUsers.map(u => u.username.split(' ')[0]).join(', ');
      document.getElementById('onlineBarText').textContent = `Сейчас онлайн: ${names}`;
    } else {
      document.getElementById('onlineBarText').textContent = 'Нет активных пользователей';
    }

    list.innerHTML = data.map(user => {
      const dotClass = COLOR_CLASS[user.color] || 'dot-default';
      const icon = STATUS_ICONS[user.status] || '❓';
      const isMe = currentUser && user.id === currentUser.id;
      const online = isOnline(user.last_seen);
      return `
        <div class="user-item">
          <div class="status-dot ${dotClass}"></div>
          <div class="user-info">
            <strong>${user.username}${isMe ? ' 👤' : ''}</strong>
            <small>${icon} ${user.status || 'Статус не задан'}</small>
          </div>
          <div class="user-item-right">
            <div class="${online ? 'online-dot' : 'offline-dot'}" title="${online ? 'Онлайн' : 'Оффлайн'}"></div>
            <span style="font-size:.68rem;color:var(--muted);font-weight:600;">${online ? 'онлайн' : 'офлайн'}</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── CHAT ──
  async function fetchMessages() {
    const { data } = await supabase
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(50);

    renderMessages(data || []);
  }

  function renderMessages(msgs) {
    const box = document.getElementById('chatMessages');
    if (!msgs.length) {
      box.innerHTML = '<div class="chat-empty">Сообщений пока нет. Будьте первым! 👋</div>';
      return;
    }
    box.innerHTML = msgs.map(m => {
      const mine = currentUser && m.user_id === currentUser.id;
      const time = new Date(m.created_at).toLocaleTimeString('ru', { hour:'2-digit', minute:'2-digit' });
      return `
        <div class="msg ${mine ? 'mine' : 'theirs'}">
          ${!mine ? `<span class="msg-author">${m.username}</span>` : ''}
          <div class="msg-bubble">${escapeHtml(m.text)}</div>
          <span class="msg-time">${time}</span>
        </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.sendMessage = async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;

    const username = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email?.split('@')[0];
    input.value = '';
    document.getElementById('chatSendBtn').disabled = true;

    await supabase.from('messages').insert({
      user_id: currentUser.id,
      username,
      text
    });

    document.getElementById('chatSendBtn').disabled = false;
    await fetchMessages();
  };

  function subscribeToChat() {
    chatSub = supabase
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
        fetchMessages();
      })
      .subscribe();
  }

  // ── UI ──
  function showLogin() {
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('profileCard').style.display = 'none';
    document.getElementById('groupCard').style.display = 'none';
    document.getElementById('timerCard').style.display = 'none';
    document.getElementById('chatCard').style.display = 'none';
  }

  function showApp(user) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('profileCard').style.display = 'block';
    document.getElementById('groupCard').style.display = 'block';
    document.getElementById('timerCard').style.display = 'block';
    document.getElementById('chatCard').style.display = 'block';

    const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
    const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0];
    const email = user.email || '';

    document.getElementById('userAvatar').src = avatar;
    document.getElementById('userName').textContent = name;
    document.getElementById('userEmail').textContent = email;

    updateTimerStats();
    fetchGroup();
    fetchMessages();
    subscribeToChat();

    clearInterval(pollInterval);
    pollInterval = setInterval(() => {
      pingOnline();
      fetchGroup();
    }, 20000);
    pingOnline();
  }

  // ── INIT ──
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      if (session?.user) {
        currentUser = session.user;
        await ensureProfile(currentUser);
        showApp(currentUser);
        window.history.replaceState(null, '', window.location.pathname);
      }
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      showLogin();
    }
  });

  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await ensureProfile(currentUser);
    showApp(currentUser);
  } else {
    showLogin();
  }
</script>
</body>
</html>
