<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мой профиль</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal-50: #e6f7f7;
      --teal-100: #b3e8e8;
      --teal-200: #80d9d9;
      --teal-300: #4dcaca;
      --teal-400: #26bfbf;
      --teal-500: #00b3b3;
      --teal-600: #009999;
      --teal-700: #007a7a;
      --teal-800: #005c5c;
      --teal-900: #003d3d;
      --bg: #e8f5f5;
      --card-bg: #ffffff;
      --text: #1a3a3a;
      --muted: #5a8a8a;
      --shadow: 0 4px 24px rgba(0,179,179,0.13);
      --radius: 18px;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 60px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(0,179,179,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(0,212,200,0.09) 0%, transparent 55%);
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 22px 18px;
      border: 1.5px solid rgba(0,179,179,0.10);
      animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-title { font-size: 1.15rem; font-weight: 800; color: var(--teal-800); margin-bottom: 6px; letter-spacing: -.3px; }

    /* LOGIN, STATUS BUTTONS, ACHIEVEMENTS, ACTIVITY, TIMER, GROUP, LEADERBOARD — оставил без изменений */
    /* (весь твой предыдущий код этих секций сохранён) */

    /* LOGIN */
    .login-card { text-align: center; padding: 40px 28px; }
    .login-card .card-title { font-size: 1.5rem; margin-bottom: 10px; }
    .login-subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 28px; font-weight: 600; }
    .google-btn {
      display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px;
      border: 2px solid #e0e0e0; border-radius: 14px; font-family: 'Nunito', sans-serif;
      font-size: 1rem; font-weight: 700; background: #fff; color: #333; cursor: pointer;
      transition: box-shadow .2s, transform .15s; width: 100%; justify-content: center;
    }
    .google-btn:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
    .google-btn:active { transform: scale(.97); }
    .google-icon { width: 22px; height: 22px; }
    .logout-btn {
      margin-top: 10px; width: 100%; padding: 9px; border: none; border-radius: 10px;
      background: var(--teal-50); color: var(--muted); font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: .85rem; cursor: pointer; transition: background .2s;
    }
    .logout-btn:hover { background: var(--teal-100); }

    /* STATUS BUTTONS */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 11px 8px; border: 2.5px solid transparent; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-size: .9rem; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .status-btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .status-btn:active { transform: scale(.97); }
    .status-btn.active { box-shadow: 0 0 0 3px var(--teal-300), 0 4px 16px rgba(0,179,179,0.25) !important; filter: brightness(1.08); }
    .btn-study { background: #00b894; color: #fff; box-shadow: 0 3px 12px rgba(0,184,148,.25); }
    .btn-coffee { background: #fdcb6e; color: #5a3e00; box-shadow: 0 3px 12px rgba(253,203,110,.30); }
    .btn-game { background: var(--teal-500); color: #fff; box-shadow: 0 3px 12px rgba(0,179,179,.28); }
    .btn-home { background: #636e72; color: #fff; box-shadow: 0 3px 12px rgba(99,110,114,.22); }

    /* MISC, MODAL, ACHIEVEMENTS, ACTIVITY GRAPH, GROUP LIST, TIMER — оставлено без изменений (сократил для краткости) */
    /* ... (весь твой код этих блоков остаётся как был) ... */

    /* CHAT */
    .chat-card { padding: 18px 22px 0; }
    .chat-messages { display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;padding:4px 2px 10px; }
    .chat-messages::-webkit-scrollbar { width:4px; }
    .chat-messages::-webkit-scrollbar-track { background:var(--teal-50);border-radius:10px; }
    .chat-messages::-webkit-scrollbar-thumb { background:var(--teal-300);border-radius:10px; }
    .msg { display:flex;flex-direction:column;max-width:85%;animation:msgIn .25s cubic-bezier(.22,.61,.36,1) both;position:relative; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);} }
    .msg.mine { align-self:flex-end;align-items:flex-end; }
    .msg.theirs { align-self:flex-start;align-items:flex-start; }
    .msg-author { font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:2px;padding:0 5px; }
    .msg-bubble { padding:7px 12px;border-radius:14px;font-size:.84rem;font-weight:600;line-height:1.4;word-break:break-word; }
    .msg.mine .msg-bubble { background:linear-gradient(135deg,var(--teal-500),var(--teal-600));color:#fff;border-bottom-right-radius:4px; }
    .msg.theirs .msg-bubble { background:var(--teal-50);color:var(--teal-900);border:1px solid rgba(0,179,179,0.12);border-bottom-left-radius:4px; }
    .msg-time { font-size:.64rem;color:var(--muted);margin-top:2px;padding:0 5px; }

    /* ==================== УЛУЧШЕННЫЕ РЕАКЦИИ ==================== */
    .msg-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
      padding: 0 5px;
      align-items: center;
      min-height: 30px;
    }

    .reaction-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 20px;
      border: 1.5px solid var(--teal-100);
      background: #fff;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--teal-800);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .reaction-btn:hover {
      transform: scale(1.08);
      background: var(--teal-50);
      border-color: var(--teal-300);
    }

    .reaction-btn.mine {
      background: rgba(0, 179, 179, 0.13);
      border-color: var(--teal-400);
      color: var(--teal-700);
    }

    .reaction-btn .r-count {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      min-width: 13px;
      text-align: center;
    }

    .add-reaction-wrap { 
      position: relative; 
      display: inline-block; 
    }

    .add-reaction-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.8px dashed var(--teal-300);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
      color: var(--teal-500);
      transition: all 0.2s;
    }

    .add-reaction-btn:hover {
      background: var(--teal-50);
      border-style: solid;
      transform: scale(1.12);
    }

    .emoji-picker {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      background: #fff;
      border-radius: 14px;
      padding: 9px;
      box-shadow: 0 12px 40px rgba(0, 100, 100, 0.25);
      border: 1.5px solid var(--teal-100);
      display: flex;
      gap: 7px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.9);
      transition: all 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .emoji-picker.open {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0) scale(1);
    }

    .emoji-opt {
      font-size: 1.4rem;
      padding: 6px 9px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .emoji-opt:hover {
      background: var(--teal-100);
      transform: scale(1.25);
    }

    /* Остальные стили чата */
    .chat-input-row { 
      display:flex;gap:7px;padding:10px 0 14px;border-top:1px solid rgba(0,179,179,.10);
      margin-top:4px;position:sticky;bottom:0;background:#fff; 
    }
    .chat-input { 
      flex:1;padding:9px 12px;border:1.5px solid var(--teal-100);border-radius:10px;
      font-family:'Nunito',sans-serif;font-size:.84rem;font-weight:600;color:var(--text);
      background:var(--teal-50);outline:none;transition:border-color .2s; 
    }
    .chat-input:focus { border-color:var(--teal-400);background:#fff; }
    .chat-input::placeholder { color:var(--muted); }
    .chat-send { 
      padding:9px 14px;border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
      color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:.84rem;
      cursor:pointer;transition:transform .15s,filter .15s;white-space:nowrap; 
    }
    .chat-send:hover { filter:brightness(1.08);transform:translateY(-1px); }
    .chat-send:active { transform:scale(.97); }
    .chat-send:disabled { opacity:.5;cursor:not-allowed;transform:none; }
    .chat-empty { text-align:center;color:var(--muted);font-size:.82rem;padding:20px 0; }
    .group-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:6px; }

    /* LEADERBOARD и TOAST — без изменений */
    .leaderboard-card { padding: 18px 22px; }
    .lb-tabs { display:flex;gap:6px;margin-bottom:12px; }
    .lb-tab { padding:5px 12px;border-radius:20px;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:700;cursor:pointer;border:1.5px solid var(--teal-100);background:transparent;color:var(--muted);transition:all .2s; }
    .lb-tab.active { background:var(--teal-500);color:#fff;border-color:var(--teal-500); }
    .leaderboard-list { display:flex;flex-direction:column;gap:7px; }
    .lb-item { display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--teal-50);border:1.5px solid rgba(0,179,179,0.08);transition:transform .15s,background .2s; }
    .lb-item:hover { background:var(--teal-100);transform:translateX(3px); }
    .lb-item.me { border-color:var(--teal-400);background:rgba(0,179,179,.07); }
    .lb-item.rank-1{background:linear-gradient(135deg,rgba(255,215,0,.13),rgba(255,180,0,.07));border-color:rgba(255,200,0,.38);}
    .lb-item.rank-2{background:linear-gradient(135deg,rgba(192,192,192,.13),rgba(160,160,160,.07));border-color:rgba(180,180,180,.38);}
    .lb-item.rank-3{background:linear-gradient(135deg,rgba(205,127,50,.13),rgba(170,100,30,.07));border-color:rgba(205,127,50,.38);}
    .lb-rank { font-size:1.1rem;font-weight:800;width:26px;text-align:center;flex-shrink:0; }
    .lb-info { flex:1;min-width:0; }
    .lb-name { font-size:.88rem;font-weight:800;color:var(--teal-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .lb-badges { display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;font-size:.78rem; }
    .lb-score { text-align:right;flex-shrink:0; }
    .lb-score-val { font-size:.95rem;font-weight:800;color:var(--teal-700);display:block; }
    .lb-score-lbl { font-size:.65rem;color:var(--muted);font-weight:600; }
    .user-item-ach { display:flex;gap:2px;margin-top:2px;font-size:.75rem;flex-wrap:wrap; }

    #achievementToast {
      position:fixed;bottom:24px;left:50%;
      transform:translateX(-50%) translateY(90px);
      background:linear-gradient(135deg,#005c5c,#003d3d);
      color:#fff;padding:12px 22px;border-radius:16px;
      font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;
      box-shadow:0 10px 40px rgba(0,100,100,.40);z-index:9999;
      transition:transform .45s cubic-bezier(.22,.61,.36,1),opacity .35s;
      opacity:0;pointer-events:none;display:flex;align-items:center;gap:9px;white-space:nowrap;
    }
    #achievementToast.show { transform:translateX(-50%) translateY(0);opacity:1; }
    .toast-icon { font-size:1.3rem; }
  </style>
</head>
<body>
  <!-- Весь твой HTML остался без изменений (я его не трогал) -->
  <!-- ... (весь body от <div class="container"> до toast) ... -->

<div class="container">
  <!-- Login -->
  <div class="card login-card" id="loginCard"> ... </div>
  <!-- Profile, Activity, Timer, Leaderboard, Group Monitor, Chat — всё как было -->

  <div class="card chat-card" id="chatCard" style="display:none;">
    <div class="card-title" style="margin-bottom:12px;">💬 Чат группы</div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty">Загрузка сообщений…</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text" placeholder="Напишите сообщение…" maxlength="300"
        onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="chat-send" id="chatSendBtn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>
</div>

<!-- Modal и Toast без изменений -->
<!-- ... -->

<script type="module">
  // ... (весь твой JavaScript до renderMessage остаётся без изменений)

  function renderMessage(m){
    const mine = currentUser && m.user_id === currentUser.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
    const reactions = m.reactions || {};
    const myUid = currentUser?.id || '';

    // Улучшенная генерация реакций
    const reactionsHtml = Object.entries(reactions)
      .filter(([, users]) => Array.isArray(users) && users.length > 0)
      .map(([emoji, users]) => {
        const count = users.length;
        const iMine = users.includes(myUid);
        return `<button class="reaction-btn ${iMine ? 'mine' : ''}" 
                        onclick="toggleReaction('${esc(m.id)}','${emoji}')" 
                        title="${count} ${count === 1 ? 'человек' : 'чел.'}">
                  ${emoji} <span class="r-count">${count}</span>
                </button>`;
      }).join('');

    const pickerHtml = `<div class="add-reaction-wrap">
      <button class="add-reaction-btn" onclick="togglePicker(event,'${esc(m.id)}')">＋</button>
      <div class="emoji-picker" id="picker-${esc(m.id)}">
        ${EMOJI_LIST.map(e => `<span class="emoji-opt" onclick="toggleReaction('${esc(m.id)}','${e}');closeAllPickers()">${e}</span>`).join('')}
      </div>
    </div>`;

    return `<div class="msg ${mine?'mine':'theirs'}" data-id="${esc(m.id)}">
      ${!mine ? `<span class="msg-author">${esc(m.username)}</span>` : ''}
      <div class="msg-bubble">${esc(m.text)}</div>
      <span class="msg-time">${time}</span>
      <div class="msg-reactions">${reactionsHtml}${pickerHtml}</div>
    </div>`;
  }

  // Остальной JavaScript (togglePicker, toggleReaction, sendMessage и т.д.) — без изменений
  // ... (весь остальной скрипт остаётся как был)

</script>
</body>
</html>
