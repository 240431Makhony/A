<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мой профиль</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-50:  #e6f7f7;
      --teal-100: #b3e8e8;
      --teal-200: #80d9d9;
      --teal-300: #4dcaca;
      --teal-400: #26bfbf;
      --teal-500: #00b3b3;
      --teal-600: #009999;
      --teal-700: #007a7a;
      --teal-800: #005c5c;
      --teal-900: #003d3d;
      --accent:   #00d4c8;
      --bg:       #e8f5f5;
      --card-bg:  #ffffff;
      --text:     #1a3a3a;
      --muted:    #5a8a8a;
      --shadow:   0 4px 24px rgba(0,179,179,0.13);
      --radius:   18px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(0,179,179,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(0,212,200,0.09) 0%, transparent 55%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
      border: 1.5px solid rgba(0,179,179,0.10);
      animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--teal-800);
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    .my-info {
      font-size: .93rem;
      color: var(--muted);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .my-info span { color: var(--teal-600); }

    /* LOGIN CARD */
    .login-card {
      text-align: center;
      padding: 40px 28px;
    }

    .login-card .card-title {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .login-subtitle {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border: 2px solid #e0e0e0;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: #fff;
      color: #333;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
      width: 100%;
      justify-content: center;
    }
    .google-btn:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .google-btn:active { transform: scale(.97); }

    .google-icon {
      width: 22px;
      height: 22px;
    }

    /* LOGOUT BTN */
    .logout-btn {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: var(--teal-50);
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s;
    }
    .logout-btn:hover { background: var(--teal-100); }

    /* BUTTONS GRID */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 10px;
      border: 2.5px solid transparent;
      border-radius: 13px;
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .status-btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .status-btn:active { transform: scale(.97); }
    .status-btn.active {
      box-shadow: 0 0 0 3px var(--teal-300), 0 4px 16px rgba(0,179,179,0.25) !important;
      filter: brightness(1.08);
    }

    .btn-study  { background: #00b894; color: #fff; box-shadow: 0 3px 12px rgba(0,184,148,.25); }
    .btn-coffee { background: #fdcb6e; color: #5a3e00; box-shadow: 0 3px 12px rgba(253,203,110,.30); }
    .btn-game   { background: var(--teal-500); color: #fff; box-shadow: 0 3px 12px rgba(0,179,179,.28); }
    .btn-home   { background: #636e72; color: #fff; box-shadow: 0 3px 12px rgba(99,110,114,.22); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal-200), transparent);
      margin: 4px 0 16px;
    }

    #grouplist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 2px;
    }
    #grouplist::-webkit-scrollbar { width: 5px; }
    #grouplist::-webkit-scrollbar-track { background: var(--teal-50); border-radius: 10px; }
    #grouplist::-webkit-scrollbar-thumb { background: var(--teal-300); border-radius: 10px; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--teal-50);
      border: 1.5px solid rgba(0,179,179,0.08);
      transition: background .2s, transform .15s;
      animation: fadeIn .3s ease both;
    }
    .user-item:hover { background: var(--teal-100); transform: translateX(3px); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .user-info { flex: 1; min-width: 0; }
    .user-info strong {
      display: block;
      font-size: .95rem;
      font-weight: 800;
      color: var(--teal-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-info small {
      font-size: .8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .dot-study  { background: #00b894; }
    .dot-coffee { background: #fdcb6e; }
    .dot-game   { background: #00b3b3; }
    .dot-home   { background: #636e72; }
    .dot-default{ background: #b2bec3; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding: 18px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, var(--teal-400), var(--teal-600));
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: .5px;
      box-shadow: 0 2px 8px rgba(0,179,179,.22);
    }
    .badge::before { content:'●'; font-size:.6rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--teal-200);
      margin-right: 4px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .profile-header-info { flex: 1; }
    .profile-header-info .name {
      font-weight: 800;
      font-size: 1rem;
      color: var(--teal-900);
    }
    .profile-header-info .email {
      font-size: .8rem;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Login Card -->
  <div class="card login-card" id="loginCard">
    <div style="font-size:3rem;margin-bottom:12px;">👋</div>
    <div class="card-title">Добро пожаловать!</div>
    <div class="login-subtitle">Войдите чтобы установить свой статус и видеть статусы группы</div>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Войти через Google
    </button>
  </div>

  <!-- Profile Card -->
  <div class="card" id="profileCard" style="display:none;">
    <div class="badge">ОНЛАЙН</div>
    <div class="card-title">Мой профиль</div>

    <div class="profile-header">
      <img id="userAvatar" class="avatar" src="" alt="avatar" onerror="this.style.display='none'"/>
      <div class="profile-header-info">
        <div class="name" id="userName">...</div>
        <div class="email" id="userEmail">...</div>
      </div>
    </div>

    <div class="btn-grid">
      <button class="status-btn btn-study"  onclick="changeStatus('Учусь','#00b894',this)">📚 Учусь</button>
      <button class="status-btn btn-coffee" onclick="changeStatus('Кофе-брейк','#fdcb6e',this)">☕ Кофе</button>
      <button class="status-btn btn-game"   onclick="changeStatus('В игре','#00b3b3',this)">🎮 В игре</button>
      <button class="status-btn btn-home"   onclick="changeStatus('Дома','#636e72',this)">🏠 Дома</button>
    </div>

    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
  </div>

  <!-- Group Monitor Card -->
  <div class="card" id="groupCard" style="display:none;">
    <div class="card-title">Монитор группы</div>
    <div class="divider"></div>
    <div id="grouplist"><div class="empty">Загрузка…</div></div>
  </div>

</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://styuzsotvczcicwbrgzi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lCwf-mXqiS3ci9bDqVem1Q_ufJd_cv9';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const STATUS_ICONS = {
    'Учусь': '📚', 'Кофе-брейк': '☕', 'В игре': '🎮', 'Дома': '🏠',
  };
  const COLOR_CLASS = {
    '#00b894': 'dot-study', '#fdcb6e': 'dot-coffee',
    '#00b3b3': 'dot-game',  '#636e72': 'dot-home',
  };

  let currentUser = null;
  let pollInterval = null;

  // ── AUTH ──
  window.loginWithGoogle = async () => {
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
  };

  window.logout = async () => {
    clearInterval(pollInterval);
    await supabase.auth.signOut();
    currentUser = null;
    showLogin();
  };

  // ── PROFILE ──
  async function ensureProfile(user) {
    const { data } = await supabase
      .from('profiles')
      .select('id')
      .eq('id', user.id)
      .single();

    if (!data) {
      const username = user.user_metadata?.full_name
        || user.user_metadata?.name
        || user.email?.split('@')[0]
        || 'User';
      await supabase.from('profiles').insert({
        id: user.id,
        username,
        status: 'Дома',
        color: '#636e72'
      });
    }
  }

  // ── STATUS ──
  window.changeStatus = async (text, color, btn) => {
    if (!currentUser) return;
    document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    await supabase.from('profiles')
      .update({ status: text, color })
      .eq('id', currentUser.id);

    fetchGroup();
  };

  // ── GROUP LIST ──
  async function fetchGroup() {
    const { data } = await supabase
      .from('profiles')
      .select('*')
      .order('username', { ascending: true });

    const list = document.getElementById('grouplist');
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty">Нет участников</div>';
      return;
    }

    list.innerHTML = data.map(user => {
      const dotClass = COLOR_CLASS[user.color] || 'dot-default';
      const icon = STATUS_ICONS[user.status] || '❓';
      const isMe = currentUser && user.id === currentUser.id;
      return `
        <div class="user-item">
          <div class="status-dot ${dotClass}"></div>
          <div class="user-info">
            <strong>${user.username}${isMe ? ' 👤' : ''}</strong>
            <small>${icon} ${user.status || 'Статус не задан'}</small>
          </div>
        </div>`;
    }).join('');
  }

  // ── UI ──
  function showLogin() {
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('profileCard').style.display = 'none';
    document.getElementById('groupCard').style.display = 'none';
  }

  function showApp(user) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('profileCard').style.display = 'block';
    document.getElementById('groupCard').style.display = 'block';

    const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
    const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0];
    const email = user.email || '';

    document.getElementById('userAvatar').src = avatar;
    document.getElementById('userName').textContent = name;
    document.getElementById('userEmail').textContent = email;

    fetchGroup();
    clearInterval(pollInterval);
    pollInterval = setInterval(fetchGroup, 4000);
  }

  // ── INIT ──
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user;
      await ensureProfile(currentUser);
      showApp(currentUser);
    } else {
      currentUser = null;
      showLogin();
    }
  });

  // Handle OAuth redirect with hash token
  if (window.location.hash && window.location.hash.includes('access_token')) {
    const { data, error } = await supabase.auth.getUser();
    if (data?.user) {
      currentUser = data.user;
      await ensureProfile(currentUser);
      showApp(currentUser);
      window.history.replaceState(null, '', window.location.pathname);
      return;
    }
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    await ensureProfile(currentUser);
    showApp(currentUser);
  } else {
    showLogin();
  }
</script>
</body>
</html>
